,{t:"build",s:"すみません トイレは どこですか",ko:"실례합니다, 화장실은 어디입니까?"}]},{id:"G07",title:"～も",sub:"~도",explain:['も는 "~도"예요. 앞에서 말한 것과 같은 내용을 더할 때 써요.',"は 자리에 も를 넣으면 돼요: わたしは → わたしも (저도).","じゃ ありません과 함께 써도 돼요: わたしも がくせいじゃ ありません (저도 학생이 아닙니다)."],ex:[{s:"わたしも がくせいです",k:"私も 学生です",ko:"저도 학생입니다"},{s:"キムさんも かんこくじんです",k:"キムさんも 韓国人です",ko:"김 씨도 한국인입니다"},{s:"これも わたしの ほんです",k:"これも 私の 本です",ko:"이것도 제 책입니다"},{s:"たなかさんも せんせいじゃ ありません",k:"田中さんも 先生じゃ ありません",ko:"다나카 씨도 선생님이 아닙니다"}],q:[{t:"pick",s:"わたし{も} がくせいです",k:"私{も} 学生です",o:["を","に"],ko:"저도 학생입니다"},{t:"pick",s:"やまださん{も} いしゃです",k:"山田さん{も} 医者です",o:["を","へ"],ko:"야마다 씨도 의사입니다"},{t:"pick",s:"それ{も} キムさんの かさです",k:"それ{も} キムさんの 傘です",o:["を","に"],ko:"그것도 김 씨의 우산입니다"},{t:"pick",s:"イさん{も} にほんじんじゃ ありません",k:"イさん{も} 日本人じゃ ありません",o:["を","で"],ko:"이 씨도 일본인이 아닙니다"},{t:"pick",s:"あした{も} やすみです",k:"明日{も} 休みです",o:["を","へ"],ko:"내일도 쉬는 날입니다"},{t:"pick",s:"これ{も} にほんの くるまです",k:"これ{も} 日本の 車です",o:["の","に"],ko:"이것도 일본 차입니다"},{t:"build",s:"たなかさんも にほんごの せんせいです",k:"田中さんも 日本語の 先生です",ko:"다나카 씨도 일본어 선생님입니다"},{t:"build",s:"その かばんも たかいです",k:"その かばんも 高いです",ko:"그 가방도 비쌉니다"}]},{id:"G08",title:"あります・います",sub:"(물건이) 있다 · (사람·동물이) 있다",explain:['あります는 물건·식물처럼 스스로 움직이지 않는 것이 "있다"예요.','います는 사람·동물처럼 살아서 움직이는 것이 "있다"예요.',"있는 것 뒤에는 が를 붙여요: ねこが います. 없을 때는 ありません·いません이에요."],ex:[{s:"ほんが あります",k:"本が あります",ko:"책이 있습니다"},{s:"ねこが います",k:"猫が います",ko:"고양이가 있습니다"},{s:"こどもが います",k:"子どもが います",ko:"아이가 있습니다"},{s:"じかんが ありません",k:"時間が ありません",ko:"시간이 없습니다"}],q:[{t:"pick",s:"りんごが {あります}",o:["います","です"],ko:"사과가 있습니다"},{t:"pick",s:"いぬが {います}",k:"犬が {います}",o:["あります","です"],ko:"개가 있습니다"},{t:"pick",s:"せんせいが {います}",k:"先生が {います}",o:["あります","ありません"],ko:"선생님이 계십니다"},{t:"pick",s:"テレビが {あります}",o:["います","いません"],ko:"텔레비전이 있습니다"},{t:"pick",s:"おかねが {ありません}",k:"お金が {ありません}",o:["いません","です"],ko:"돈이 없습니다"},{t:"pick",s:"とり{が} います",k:"鳥{が} います",o:["を","へ"],ko:"새가 있습니다"},{t:"build",s:"やまださんは こどもが います",k:"山田さんは 子どもが います",ko:"야마다 씨는 아이가 있습니다"},{t:"build",s:"きょうは じかんが ありません",k:"今日は 時間が ありません",ko:"오늘은 시간이 없습니다"}]},{id:"G09",title:"～に あります / ～に います",sub:"~에 있습니다 (위치)",explain:['"~에 있다"는 장소 뒤에 に를 붙여요: へやに います (방에 있습니다). で가 아니라 に예요.','위치 말: うえ(위)·した(아래)·なか(안)·まえ(앞). つくえの うえに = "책상 위에".','"어디에 있어요?"는 どこに ありますか / どこに いますか예요.'],ex:[{s:"つくえの うえに ほんが あります",k:"机の 上に 本が あります",ko:"책상 위에 책이 있습니다"},{s:"へやに ねこが います",k:"部屋に 猫が います",ko:"방에 고양이가 있습니다"},{s:"はこの なかに なにが ありますか",k:"箱の 中に 何が ありますか",ko:"상자 안에 무엇이 있습니까?"},{s:"キムさんは きょうしつに います",k:"キムさんは 教室に います",ko:"김 씨는 교실에 있습니다"}],q:[{t:"pick",s:"つくえの うえ{に} ほんが あります",k:"机の 上{に} 本が あります",o:["で","を"],ko:"책상 위에 책이 있습니다"},{t:"pick",s:"いすの した{に} いぬが います",k:"いすの 下{に} 犬が います",o:["で","が"],ko:"의자 아래에 개가 있습니다"},{t:"pick",s:"へやに こどもが {います}",k:"部屋に 子どもが {います}",o:["あります","です"],ko:"방에 아이가 있습니다"},{t:"pick",s:"かばんの なかに さいふが {あります}",k:"かばんの 中に 財布が {あります}",o:["います","です"],ko:"가방 안에 지갑이 있습니다"},{t:"pick",s:"はこ{の} なかに ねこが います",k:"箱{の} 中に 猫が います",o:["に","が"],ko:"상자 안에 고양이가 있습니다"},{t:"pick",s:"たなかさんは どこ{に} いますか",k:"田中さんは どこ{に} いますか",o:["を","が"],ko:"다나카 씨는 어디에 있습니까?"},{t:"build",s:"ねこは いすの したに います",k:"猫は いすの 下に います",ko:"고양이는 의자 아래에 있습니다"},{t:"build",s:"ぎんこうは えきの まえに あります",k:"銀行は 駅の 前に あります",ko:"은행은 역 앞에 있습니다"}]},{id:"G10",title:"～を ～ます",sub:"~을/를 ~합니다",explain:['を는 "~을/를"이에요. 글자는 を지만 "오(お)"로 읽어요.','동사 ます형은 공손한 "~합니다/~해요"예요: たべます(먹어요), のみます(마셔요), みます(봐요).',"일본어는 한국어처럼 동사가 문장 맨 끝에 와요: 무엇을 ＋ 동사."],ex:[{s:"ごはんを たべます",k:"ご飯を 食べます",ko:"밥을 먹습니다"},{s:"みずを のみます",k:"水を 飲みます",ko:"물을 마십니다"},{s:"わたしは まいにち しんぶんを よみます",k:"私は 毎日 新聞を 読みます",ko:"저는 매일 신문을 읽습니다"},{s:"キムさんは テレビを みます",k:"キムさんは テレビを 見ます",ko:"김 씨는 텔레비전을 봅니다"}],q:[{t:"pick",s:"パン{を} たべます",k:"パン{を} 食べます",o:["お","に"],ko:"빵을 먹습니다"},{t:"pick",s:"コーヒー{を} のみます",k:"コーヒー{を} 飲みます",o:["に","へ"],ko:"커피를 마십니다"},{t:"pick",s:"えいがを {みます}",k:"映画を {見ます}",o:["のみます","たべます"],ko:"영화를 봅니다"},{t:"pick",s:"みずを {のみます}",k:"水を {飲みます}",o:["たべます","よみます"],ko:"물을 마십니다"},{t:"pick",s:"わたしは ほん{を} よみます",k:"私は 本{を} 読みます",o:["が","に"],ko:"저는 책을 읽습니다"},{t:"pick",s:"まいにち にほんごを {べんきょうします}",k:"毎日 日本語を {勉強します}",o:["のみます","たべます"],ko:"매일 일본어를 공부합니다"},{t:"build",s:"わたしは にほんの えいがを みます",k:"私は 日本の 映画を 見ます",ko:"저는 일본 영화를 봅니다"},{t:"build",s:"たなかさんは おんがくを ききます",k:"田中さんは 音楽を 聞きます",ko:"다나카 씨는 음악을 듣습니다"}]},{id:"G11",title:"～ません・～ました・～ませんでした",sub:"안 ~합니다 · ~했습니다 · 안 ~했습니다",explain:["ます를 바꾸면 뜻이 바뀌어요: たべます(먹어요) → たべません(안 먹어요).","과거는 ました: たべました(먹었어요). 과거 부정은 ませんでした: たべませんでした(안 먹었어요).","きのう(어제)가 있으면 과거형, あした(내일)가 있으면 ます·ません을 써요."],ex:[{s:"わたしは コーヒーを のみません",k:"私は コーヒーを 飲みません",ko:"저는 커피를 마시지 않습니다"},{s:"きのう えいがを みました",k:"昨日 映画を 見ました",ko:"어제 영화를 봤습니다"},{s:"けさ ごはんを たべませんでした",k:"今朝 ご飯を 食べませんでした",ko:"오늘 아침에 밥을 먹지 않았습니다"},{s:"きのう にほんごを べんきょうしました",k:"昨日 日本語を 勉強しました",ko:"어제 일본어를 공부했습니다"}],q:[{t:"pick",s:"きのう ほんを {よみました}",k:"昨日 本を {読みました}",o:["よみます","よみません"],ko:"어제 책을 읽었습니다"},{t:"pick",s:"きのう テレビを {みませんでした}",k:"昨日 テレビを {見ませんでした}",o:["みません","みませんだった"],ko:"어제 텔레비전을 보지 않았습니다"},{t:"pick",s:"あした えいがを {みます}",k:"明日 映画を {見ます}",o:["みました","みませんでした"],ko:"내일 영화를 봅니다"},{t:"pick",s:"あしたは {べんきょうしません}",k:"明日は {勉強しません}",o:["べんきょうしました","べんきょうしませんでした"],ko:"내일은 공부하지 않습니다"},{t:"pick",s:"せんしゅう くつを {かいました}",k:"先週 靴を {買いました}",o:["かいます","かいません"],ko:"지난주에 신발을 샀습니다"},{t:"pick",s:"きのう しゅくだいを {しませんでした}",k:"昨日 宿題を {しませんでした}",o:["しません","しないでした"],ko:"어제 숙제를 하지 않았습니다"},{t:"build",s:"わたしは さかなを たべませんでした",k:"私は 魚を 食べませんでした",ko:"저는 생선을 먹지 않았습니다"},{t:"build",s:"キムさんは コーヒーを のみません",k:"キムさんは コーヒーを 飲みません",ko:"김 씨는 커피를 마시지 않습니다"}]},{id:"G12",title:"～に／へ いきます",sub:"~에 갑니다 (방향)",explain:['"~에 가요"는 장소 뒤에 に나 へ를 붙여요. がっこうに いきます = がっこうへ いきます.','へ는 조사로 쓸 때 "헤"가 아니라 "에(え)"로 읽어요.','いきます(가요)·きます(와요)·かえります(돌아가요)와 함께 써요. "어디에 가요?"는 どこへ いきますか.'],ex:[{s:"がっこうに いきます",k:"学校に 行きます",ko:"학교에 갑니다"},{s:"あした にほんへ いきます",k:"明日 日本へ 行きます",ko:"내일 일본에 갑니다"},{s:"たなかさんは うちに かえりました",k:"田中さんは うちに 帰りました",ko:"다나카 씨는 집에 돌아갔습니다"},{s:"きのう どこへ いきましたか",k:"昨日 どこへ 行きましたか",ko:"어제 어디에 갔습니까?"}],q:[{t:"pick",s:"えき{に} いきます",k:"駅{に} 行きます",o:["で","の"],ko:"역에 갑니다"},{t:"pick",s:"あした ぎんこう{へ} いきます",k:"明日 銀行{へ} 行きます",o:["え","を"],ko:"내일 은행에 갑니다"},{t:"pick",s:"キムさんは かんこく{に} かえります",k:"キムさんは 韓国{に} 帰ります",o:["で","が"],ko:"김 씨는 한국으로 돌아갑니다"},{t:"pick",s:"どこ{へ} いきますか",k:"どこ{へ} 行きますか",o:["が","で"],ko:"어디에 갑니까?"},{t:"pick",s:"きのう デパートに {いきました}",k:"昨日 デパートに {行きました}",o:["いきます","いきません"],ko:"어제 백화점에 갔습니다"},{t:"pick",s:"ともだちが うちに {きます}",k:"友達が うちに {来ます}",o:["あります","たべます"],ko:"친구가 우리 집에 옵니다"},{t:"build",s:"わたしは ともだちの うちに いきます",k:"私は 友達の うちに 行きます",ko:"저는 친구 집에 갑니다"},{t:"build",s:"やまださんは にほんへ かえりました",k:"山田さんは 日本へ 帰りました",ko:"야마다 씨는 일본으로 돌아갔습니다"}]}];var U4=[{id:"G13",title:"～で",sub:"~에서(장소) / ~로(수단)",explain:['で는 무언가를 "하는 곳"에 붙어요. としょかんで = 도서관에서',"타는 것이나 도구에도 붙어요. バスで = 버스로, はしで = 젓가락으로",'"있는 곳"은 に, "하는 곳"은 で예요. こうえんに います / こうえんで あそびます'],ex:[{s:"としょかんで べんきょうします",k:"図書館で 勉強します",ko:"도서관에서 공부합니다"},{s:"バスで がっこうに いきます",k:"バスで 学校に 行きます",ko:"버스로 학교에 갑니다"},{s:"はしで ごはんを たべます",k:"はしで ご飯を 食べます",ko:"젓가락으로 밥을 먹습니다"},{s:"にほんごで てがみを かきます",k:"日本語で 手紙を 書きます",ko:"일본어로 편지를 씁니다"}],q:[{t:"pick",s:"レストラン{で} ごはんを たべます",k:"レストラン{で} ご飯を 食べます",o:["に","を"],ko:"레스토랑에서 밥을 먹습니다"},{t:"pick",s:"タクシー{で} えきに いきます",k:"タクシー{で} 駅に 行きます",o:["に","を"],ko:"택시로 역에 갑니다"},{t:"pick",s:"こうえん{で} あそびます",k:"公園{で} 遊びます",o:["に","を"],ko:"공원에서 놉니다"},{t:"pick",s:"ナイフ{で} パンを きります",k:"ナイフ{で} パンを 切ります",o:["を","に"],ko:"칼로 빵을 자릅니다"},{t:"pick",s:"うち{で} テレビを みます",k:"家{で} テレビを 見ます",o:["に","を"],ko:"집에서 텔레비전을 봅니다"},{t:"pick",s:"えいご{で} なまえを かきます",k:"英語{で} 名前を 書きます",o:["を","に"],ko:"영어로 이름을 씁니다"},{t:"build",s:"あの だいがくで べんきょうします",k:"あの 大学で 勉強します",ko:"저 대학에서 공부합니다"},{t:"build",s:"わたしは ちかてつで いきます",k:"私は 地下鉄で 行きます",ko:"저는 지하철로 갑니다"}]},{id:"G14",title:"～と",sub:"~와/과, ~하고 (같이)",explain:["と는 명사와 명사를 이어요. パンと たまご = 빵과 달걀",'사람 뒤에 붙으면 "~와 함께"예요. ともだちと いきます = 친구와 갑니다',"혼자서 할 때는 ひとりで라고 해요."],ex:[{s:"パンと たまごを たべます",k:"パンと 卵を 食べます",ko:"빵과 달걀을 먹습니다"},{s:"ともだちと こうえんに いきます",k:"友達と 公園に 行きます",ko:"친구와 공원에 갑니다"},{s:"かぞくと ごはんを たべました",k:"家族と ご飯を 食べました",ko:"가족과 밥을 먹었습니다"},{s:"きのう ひとりで えいがを みました",k:"昨日 一人で 映画を 見ました",ko:"어제 혼자서 영화를 봤습니다"}],q:[{t:"pick",s:"ともだち{と} えいがを みます",k:"友達{と} 映画を 見ます",o:["で","を"],ko:"친구와 영화를 봅니다"},{t:"pick",s:"りんご{と} みかんを かいました",k:"りんご{と} みかんを 買いました",o:["を","で"],ko:"사과와 귤을 샀습니다"},{t:"pick",s:"せんせい{と} はなしました",k:"先生{と} 話しました",o:["を","で"],ko:"선생님과 이야기했습니다"},{t:"pick",s:"あね{と} デパートに いきます",k:"姉{と} デパートに 行きます",o:["で","を"],ko:"언니(누나)와 백화점에 갑니다"},{t:"pick",s:"ノート{と} えんぴつが あります",k:"ノート{と} 鉛筆が あります",o:["で","を"],ko:"노트와 연필이 있습니다"},{t:"pick",s:"ちち{と} テニスを しました",k:"父{と} テニスを しました",o:["を","で"],ko:"아빠와 테니스를 쳤습니다"},{t:"build",s:"コーヒーと ケーキを かいました",k:"コーヒーと ケーキを 買いました",ko:"커피와 케이크를 샀습니다"},{t:"build",s:"にほんの ともだちと はなします",k:"日本の 友達と 話します",ko:"일본 친구와 이야기합니다"}]},{id:"G15",title:"い형용사 (현재)",sub:"~いです / ~くないです",explain:["い로 끝나는 형용사예요. たかい + です = たかいです (비쌉니다/높습니다)","부정은 끝의 い를 빼고 くない를 붙여요. たかい → たかくないです","いい(좋다)만 특별해요. いい → よくないです"],ex:[{s:"この かばんは たかいです",k:"この かばんは 高いです",ko:"이 가방은 비쌉니다"},{s:"きょうは さむくないです",k:"今日は 寒くないです",ko:"오늘은 춥지 않습니다"},{s:"この ほんは おもしろいです",k:"この 本は 面白いです",ko:"이 책은 재미있습니다"},{s:"てんきは よくないです",k:"天気は よくないです",ko:"날씨는 좋지 않습니다"}],q:[{t:"pick",s:"この へやは {ひろくない}です",k:"この 部屋は {広くない}です",o:["ひろいくない","ひろいじゃない"],ko:"이 방은 넓지 않습니다"},{t:"pick",s:"きょうは {あつくない}です",k:"今日は {暑くない}です",o:["あついくない","あつくじゃない"],ko:"오늘은 덥지 않습니다"},{t:"pick",s:"この カメラは {よくない}です",o:["いくない","いいくない"],ko:"이 카메라는 좋지 않습니다"},{t:"pick",s:"にほんごは {むずかしくない}です",k:"日本語は {難しくない}です",o:["むずかしいじゃない","むずかしいくない"],ko:"일본어는 어렵지 않습니다"},{t:"pick",s:"この りんごは {あまい}です",k:"この りんごは {甘い}です",o:["あまくない","あまいな"],ko:"이 사과는 답니다"},{t:"pick",s:"がっこうは {とおくない}です",k:"学校は {遠くない}です",o:["とおいない","とおいくない"],ko:"학교는 멀지 않습니다"},{t:"build",s:"この とけいは たかくないです",k:"この 時計は 高くないです",ko:"이 시계는 비싸지 않습니다"},{t:"build",s:"きょうの てんきは いいです",k:"今日の 天気は いいです",ko:"오늘 날씨는 좋습니다"}]},{id:"G16",title:"い형용사 (과거)",sub:"~かったです / ~くなかったです",explain:["과거는 끝의 い를 빼고 かった를 붙여요. たかい → たかかったです","과거 부정은 い를 빼고 くなかった예요. たかい → たかくなかったです","いい는 よ로 바꿔요. よかったです / よくなかったです"],ex:[{s:"きのうは さむかったです",k:"昨日は 寒かったです",ko:"어제는 추웠습니다"},{s:"テストは むずかしくなかったです",k:"テストは 難しくなかったです",ko:"시험은 어렵지 않았습니다"},{s:"りょこうは たのしかったです",k:"旅行は 楽しかったです",ko:"여행은 즐거웠습니다"},{s:"えいがは よかったです",k:"映画は よかったです",ko:"영화는 좋았습니다"}],q:[{t:"pick",s:"きのうは {あつかった}です",k:"昨日は {暑かった}です",o:["あついでした","あついかった"],ko:"어제는 더웠습니다"},{t:"pick",s:"パーティーは {たのしかった}です",k:"パーティーは {楽しかった}です",o:["たのしいでした","たのしくた"],ko:"파티는 즐거웠습니다"},{t:"pick",s:"その みせは {たかくなかった}です",k:"その 店は {高くなかった}です",o:["たかいくなかった","たかかったない"],ko:"그 가게는 비싸지 않았습니다"},{t:"pick",s:"てんきは {よかった}です",k:"天気は {よかった}です",o:["いかった","いいかった"],ko:"날씨는 좋았습니다"},{t:"pick",s:"ホテルは {よくなかった}です",o:["いくなかった","いいくなかった"],ko:"호텔은 좋지 않았습니다"},{t:"pick",s:"きのうの ばんごはんは {おいしかった}です",k:"昨日の 晩ご飯は {おいしかった}です",o:["おいしいでした","おいしくた"],ko:"어제 저녁밥은 맛있었습니다"},{t:"build",s:"きのうは とても さむかったです",k:"昨日は とても 寒かったです",ko:"어제는 아주 추웠습니다"},{t:"build",s:"その えいがは おもしろくなかったです",k:"その 映画は 面白くなかったです",ko:"그 영화는 재미없었습니다"}]},{id:"G17",title:"な형용사",sub:"~です / ~じゃないです / ~でした",explain:["しずか, きれい, げんき 같은 말은 な형용사예요. 명사처럼 です를 붙여요.","부정은 じゃないです, 과거는 でした, 과거 부정은 じゃなかったです예요.","きれい는 い로 끝나지만 な형용사예요! きれいくない(X) → きれいじゃない(O)"],ex:[{s:"この まちは しずかです",k:"この 町は 静かです",ko:"이 동네는 조용합니다"},{s:"わたしの へやは きれいじゃないです",k:"私の 部屋は きれいじゃないです",ko:"제 방은 깨끗하지 않습니다"},{s:"きのうは ひまでした",k:"昨日は 暇でした",ko:"어제는 한가했습니다"},{s:"しごとは たいへんじゃなかったです",k:"仕事は 大変じゃなかったです",ko:"일은 힘들지 않았습니다"}],q:[{t:"pick",s:"この としょかんは {しずか}です",k:"この 図書館は {静か}です",o:["しずかな","しずかい"],ko:"이 도서관은 조용합니다"},{t:"pick",s:"あの ひとは {げんきじゃない}です",k:"あの 人は {元気じゃない}です",o:["げんきくない","げんきない"],ko:"저 사람은 기운이 없습니다"},{t:"pick",s:"へやは {きれいじゃない}です",k:"部屋は {きれいじゃない}です",o:["きれくない","きれいくない"],ko:"방은 깨끗하지 않습니다"},{t:"pick",s:"きのうは {ひまでした}",k:"昨日は {暇でした}",o:["ひまかったです","ひまなでした"],ko:"어제는 한가했습니다"},{t:"pick",s:"しごとは {たいへんでした}",k:"仕事は {大変でした}",o:["たいへんかったです","たいへんなでした"],ko:"일은 힘들었습니다"},{t:"pick",s:"えきの まえは {にぎやか}です",k:"駅の 前は {にぎやか}です",o:["にぎやかい","にぎやかな"],ko:"역 앞은 북적입니다"},{t:"build",s:"この こうえんは とても きれいです",k:"この 公園は とても きれいです",ko:"이 공원은 아주 예쁩니다"},{t:"build",s:"わたしの まちは しずかでした",k:"私の 町は 静かでした",ko:"우리 동네는 조용했습니다"}]},{id:"G18",title:"형용사 ＋ 명사",sub:"たかい やま / しずかな まち",explain:["い형용사는 그대로 명사 앞에 붙여요. たかい + やま = たかい やま (높은 산)","な형용사는 사이에 な를 넣어요. しずか + まち = しずかな まち (조용한 동네)","きれい도 な형용사라서 きれいな はな라고 해요."],ex:[{s:"あれは たかい やまです",k:"あれは 高い 山です",ko:"저것은 높은 산입니다"},{s:"ここは しずかな まちです",k:"ここは 静かな 町です",ko:"여기는 조용한 동네입니다"},{s:"あかい かさを かいました",k:"赤い 傘を 買いました",ko:"빨간 우산을 샀습니다"},{s:"きれいな はなが あります",k:"きれいな 花が あります",ko:"예쁜 꽃이 있습니다"}],q:[{t:"pick",s:"{しずかな} へやです",k:"{静かな} 部屋です",o:["しずか","しずかい"],ko:"조용한 방입니다"},{t:"pick",s:"{おおきい} いぬが います",k:"{大きい} 犬が います",o:["おおきいな","おおきく"],ko:"큰 개가 있습니다"},{t:"pick",s:"それは {ゆうめいな} ほんです",k:"それは {有名な} 本です",o:["ゆうめい","ゆうめいの"],ko:"그것은 유명한 책입니다"},{t:"pick",s:"{あたらしい} くつを かいました",k:"{新しい} 靴を 買いました",o:["あたらしいな","あたらしな"],ko:"새 신발을 샀습니다"},{t:"pick",s:"ここは {きれいな} こうえんです",k:"ここは {きれいな} 公園です",o:["きれい","きれいい"],ko:"여기는 예쁜 공원입니다"},{t:"pick",s:"きのう {おもしろい} えいがを みました",k:"昨日 {面白い} 映画を 見ました",o:["おもしろいな","おもしろな"],ko:"어제 재미있는 영화를 봤습니다"},{t:"build",s:"これは とても たかい とけいです",k:"これは とても 高い 時計です",ko:"이것은 아주 비싼 시계입니다"},{t:"build",s:"ここは にぎやかな まちです",k:"ここは にぎやかな 町です",ko:"여기는 북적이는 동네입니다"}]},{id:"G19",title:"～が すきです",sub:"좋아하다 · 싫어하다 · 잘하다 · 못하다",explain:['"~을 좋아해요"는 を가 아니라 が를 써요. ねこが すきです',"きらい(싫어하다), じょうず(잘하다), へた(못하다)도 똑같이 が를 써요.","모두 な형용사라서 부정은 すきじゃないです예요."],ex:[{s:"わたしは くだものが すきです",k:"私は 果物が 好きです",ko:"저는 과일을 좋아합니다"},{s:"いもうとは やさいが きらいです",k:"妹は 野菜が 嫌いです",ko:"여동생은 채소를 싫어합니다"},{s:"たなかさんは えが じょうずです",k:"田中さんは 絵が 上手です",ko:"다나카 씨는 그림을 잘 그립니다"},{s:"わたしは うたが へたです",k:"私は 歌が 下手です",ko:"저는 노래를 못합니다"}],q:[{t:"pick",s:"わたしは ねこ{が} すきです",k:"私は 猫{が} 好きです",o:["を","で"],ko:"저는 고양이를 좋아합니다"},{t:"pick",s:"ちちは りょうり{が} じょうずです",k:"父は 料理{が} 上手です",o:["を","に"],ko:"아빠는 요리를 잘합니다"},{t:"pick",s:"あには さかなが {きらい}です",k:"兄は 魚が {嫌い}です",o:["すき","へた"],ko:"형(오빠)은 생선을 싫어합니다"},{t:"pick",s:"わたしは スポーツが {すきじゃない}です",k:"私は スポーツが {好きじゃない}です",o:["すきくない","すきない"],ko:"저는 스포츠를 좋아하지 않습니다"},{t:"pick",s:"わたしは テニスが {へた}です",k:"私は テニスが {下手}です",o:["じょうず","へたい"],ko:"저는 테니스를 못 칩니다"},{t:"pick",s:"どんな たべもの{が} すきですか",k:"どんな 食べ物{が} 好きですか",o:["を","に"],ko:"어떤 음식을 좋아합니까?"},{t:"build",s:"わたしは あまい ものが すきです",k:"私は 甘い ものが 好きです",ko:"저는 단 것을 좋아합니다"},{t:"build",s:"わたしの あには うたが へたです",k:"私の 兄は 歌が 下手です",ko:"우리 형(오빠)은 노래를 못합니다"}]},{id:"G20",title:"～が ほしいです / ～たいです",sub:"~을 갖고 싶다 / ~하고 싶다",explain:["물건을 갖고 싶을 때는 ～が ほしいです라고 해요. くるまが ほしいです","하고 싶을 때는 ます를 빼고 たい를 붙여요. たべます → たべたいです","たい는 い형용사처럼 변해요. たべたくないです = 먹고 싶지 않아요"],ex:[{s:"あたらしい かばんが ほしいです",k:"新しい かばんが ほしいです",ko:"새 가방을 갖고 싶습니다"},{s:"つめたい みずが のみたいです",k:"冷たい 水が 飲みたいです",ko:"차가운 물을 마시고 싶습니다"},{s:"にほんに いきたいです",k:"日本に 行きたいです",ko:"일본에 가고 싶습니다"},{s:"きょうは べんきょうしたくないです",k:"今日は 勉強したくないです",ko:"오늘은 공부하고 싶지 않습니다"}],q:[{t:"pick",s:"ケーキが {たべたい}です",k:"ケーキが {食べたい}です",o:["たべるたい","たべますたい"],ko:"케이크를 먹고 싶습니다"},{t:"pick",s:"えいがが {みたい}です",k:"映画が {見たい}です",o:["みるたい","みますたい"],ko:"영화를 보고 싶습니다"},{t:"pick",s:"おおきい テレビ{が} ほしいです",k:"大きい テレビ{が} ほしいです",o:["で","に"],ko:"큰 텔레비전을 갖고 싶습니다"},{t:"pick",s:"うみで {およぎたい}です",k:"海で {泳ぎたい}です",o:["およぐたい","およがたい"],ko:"바다에서 수영하고 싶습니다"},{t:"pick",s:"いまは なにも {のみたくない}です",k:"今は 何も {飲みたくない}です",o:["のみたいじゃない","のみたいくない"],ko:"지금은 아무것도 마시고 싶지 않습니다"},{t:"pick",s:"ともだちに {あいたい}です",k:"友達に {会いたい}です",o:["あうたい","あわたい"],ko:"친구를 만나고 싶습니다"},{t:"build",s:"わたしは あたらしい くつが ほしいです",k:"私は 新しい 靴が ほしいです",ko:"저는 새 신발을 갖고 싶습니다"},{t:"build",s:"あの レストランで たべたいです",k:"あの レストランで 食べたいです",ko:"저 레스토랑에서 먹고 싶습니다"}]},{id:"G21",title:"～から ～まで",sub:"~부터 ~까지 (시간·장소)",explain:['から는 "~부터/~에서", まで는 "~까지"예요.',"시간에도 장소에도 써요. くじから ごじまで / うちから えきまで","하나만 따로 써도 돼요. なつやすみは あしたからです"],ex:[{s:"くじから ごじまで はたらきます",k:"九時から 五時まで 働きます",ko:"9시부터 5시까지 일합니다"},{s:"うちから えきまで あるきます",k:"家から 駅まで 歩きます",ko:"집에서 역까지 걷습니다"},{s:"ぎんこうは さんじまでです",k:"銀行は 三時までです",ko:"은행은 3시까지입니다"},{s:"なつやすみは あしたからです",k:"夏休みは 明日からです",ko:"여름 방학은 내일부터입니다"}],q:[{t:"pick",s:"がっこうは はちじ{から}です",k:"学校は 八時{から}です",o:["まで","を"],ko:"학교는 8시부터입니다"},{t:"pick",s:"ここ{から} えきまで とおいですか",k:"ここ{から} 駅まで 遠いですか",o:["まで","に"],ko:"여기에서 역까지 멉니까?"},{t:"pick",s:"げつようびから きんようび{まで} はたらきます",k:"月曜日から 金曜日{まで} 働きます",o:["から","を"],ko:"월요일부터 금요일까지 일합니다"},{t:"pick",s:"としょかんは なんじ{まで}ですか",k:"図書館は 何時{まで}ですか",o:["に","を"],ko:"도서관은 몇 시까지입니까?"},{t:"pick",s:"ソウル{から} とうきょうまで ひこうきで いきます",k:"ソウル{から} 東京まで 飛行機で 行きます",o:["まで","を"],ko:"서울에서 도쿄까지 비행기로 갑니다"},{t:"pick",s:"ひるやすみは じゅうにじから いちじ{まで}です",k:"昼休みは 十二時から 一時{まで}です",o:["から","に"],ko:"점심시간은 12시부터 1시까지입니다"},{t:"build",s:"あさから ばんまで はたらきます",k:"朝から 晩まで 働きます",ko:"아침부터 밤까지 일합니다"},{t:"build",s:"この みせは くじからです",k:"この 店は 九時からです",ko:"이 가게는 9시부터입니다"}]},{id:"G22",title:"시간 말하기",sub:"～じ ～ふん/ぷん に",explain:['"~시"는 じ예요. よじ(4시), しちじ(7시), くじ(9시)는 읽기에 주의해요!','"~분"은 ふん인데 ぷん이 되기도 해요. いっぷん, さんぷん, よんぷん, ろっぷん, はっぷん, じゅっぷん',"그 시각에 무엇을 할 때는 に를 붙여요. しちじに おきます / 몇 시 = なんじ"],ex:[{s:"まいあさ しちじに おきます",k:"毎朝 七時に 起きます",ko:"매일 아침 7시에 일어납니다"},{s:"いま なんじですか",k:"今 何時ですか",ko:"지금 몇 시입니까?"},{s:"くじ じゅっぷんに でかけます",k:"九時 十分に 出かけます",ko:"9시 10분에 나갑니다"},{s:"よじ はんに うちに かえります",k:"四時 半に 家に 帰ります",ko:"4시 반에 집에 돌아갑니다"}],q:[{t:"pick",s:"まいばん じゅういちじ{に} ねます",k:"毎晩 十一時{に} 寝ます",o:["で","を"],ko:"매일 밤 11시에 잡니다"},{t:"pick",s:"いま {よじ}です",k:"今 {四時}です",o:["よんじ","しじ"],ko:"지금 4시입니다"},{t:"pick",s:"じゅうじ {ろっぷん}です",k:"十時 {六分}です",o:["ろくふん","ろくぷん"],ko:"10시 6분입니다"},{t:"pick",s:"{くじ}に はじまります",k:"{九時}に 始まります",o:["きゅうじ","くうじ"],ko:"9시에 시작합니다"},{t:"pick",s:"がっこうは {なんじ}からですか",k:"学校は {何時}からですか",o:["なにじ","なんじかん"],ko:"학교는 몇 시부터입니까?"},{t:"pick",s:"しちじ {さんぷん}に うちを でます",k:"七時 {三分}に 家を 出ます",o:["さんふん","みっぷん"],ko:"7시 3분에 집을 나섭니다"},{t:"build",s:"えいがは しちじ はんからです",k:"映画は 七時 半からです",ko:"영화는 7시 반부터입니다"},{t:"build",s:"でんしゃは はちじ ごふんに きます",k:"電車は 八時 五分に 来ます",ko:"전철은 8시 5분에 옵니다"}]},{id:"G23",title:"수 세기",sub:"ひとつ · ひとり · ～まい · ～ほん",explain:["물건은 ひとつ, ふたつ, みっつ…로 세고, 몇 개는 いくつ예요. りんごを みっつ かいます","사람은 ひとり, ふたり, さんにん, よにん…, 얇은 것(종이·셔츠)은 ～まい로 세요.","긴 것(펜·우산)은 ～ほん인데 いっぽん, さんぼん, ろっぽん처럼 소리가 바뀌어요."],ex:[{s:"りんごを みっつ かいました",k:"りんごを 三つ 買いました",ko:"사과를 세 개 샀습니다"},{s:"きょうしつに がくせいが ふたり います",k:"教室に 学生が 二人 います",ko:"교실에 학생이 두 명 있습니다"},{s:"はがきを ごまい かいました",k:"はがきを 五枚 買いました",ko:"엽서를 다섯 장 샀습니다"},{s:"ペンが いっぽん あります",k:"ペンが 一本 あります",ko:"펜이 한 자루 있습니다"}],q:[{t:"pick",s:"みかんを {ふたつ} たべました",k:"みかんを {二つ} 食べました",o:["ふたり","にまい"],ko:"귤을 두 개 먹었습니다"},{t:"pick",s:"いもうとが {ひとり} います",k:"妹が {一人} います",o:["ひとつ","いちにん"],ko:"여동생이 한 명 있습니다"},{t:"pick",s:"シャツを {にまい} かいました",k:"シャツを {二枚} 買いました",o:["にほん","ふたり"],ko:"셔츠를 두 장 샀습니다"},{t:"pick",s:"かさが {さんぼん} あります",k:"傘が {三本} あります",o:["さんほん","さんぽん"],ko:"우산이 세 개 있습니다"},{t:"pick",s:"えんぴつを {ろっぽん} かいました",k:"鉛筆を {六本} 買いました",o:["ろくほん","ろくぼん"],ko:"연필을 여섯 자루 샀습니다"},{t:"pick",s:"たまごは {いくつ} ありますか",k:"卵は {いくつ} ありますか",o:["なんにん","なんまい"],ko:"달걀은 몇 개 있습니까?"},{t:"build",s:"わたしの かぞくは よにんです",k:"私の 家族は 四人です",ko:"우리 가족은 네 명입니다"},{t:"build",s:"きってを にまい かいました",k:"切手を 二枚 買いました",ko:"우표를 두 장 샀습니다"}]},{id:"G24",title:"～ませんか / ～ましょう",sub:"같이 ~하지 않을래요? / ~합시다 / ~할까요?",explain:['ます를 ませんか로 바꾸면 "같이 ~하지 않을래요?"예요. いきます → いきませんか','ましょう는 "~합시다", ましょうか는 "~할까요?"예요. いきましょう / いきましょうか','ましょうか는 "제가 ~해 드릴까요?"라고 도울 때도 써요.'],ex:[{s:"いっしょに えいがを みませんか",k:"一緒に 映画を 見ませんか",ko:"같이 영화를 보지 않을래요?"},{s:"ちょっと やすみましょう",k:"ちょっと 休みましょう",ko:"잠깐 쉽시다"},{s:"どこで あいましょうか",k:"どこで 会いましょうか",ko:"어디에서 만날까요?"},{s:"しゃしんを とりましょうか",k:"写真を 撮りましょうか",ko:"사진을 찍어 드릴까요?"}],q:[{t:"pick",s:"いっしょに おちゃを {のみませんか}",k:"一緒に お茶を {飲みませんか}",o:["のむませんか","のまませんか"],ko:"같이 차를 마시지 않을래요?"},{t:"pick",s:"もう {かえりましょう}",k:"もう {帰りましょう}",o:["かえるましょう","かえらましょう"],ko:"이제 돌아갑시다"},{t:"pick",s:"あした なにを {しましょうか}",k:"明日 何を {しましょうか}",o:["するましょうか","さましょうか"],ko:"내일 무엇을 할까요?"},{t:"pick",s:"にもつを {もちましょうか}",k:"荷物を {持ちましょうか}",o:["もつましょうか","もたましょうか"],ko:"짐을 들어 드릴까요?"},{t:"pick",s:"どようびに いっしょに {でかけませんか}",k:"土曜日に 一緒に {出かけませんか}",o:["でかけるませんか","でかけないませんか"],ko:"토요일에 같이 나가지 않을래요?"},{t:"pick",s:"じゃあ {はじめましょう}",k:"じゃあ {始めましょう}",o:["はじめるましょう","はじめないましょう"],ko:"그럼 시작합시다"},{t:"build",s:"あの きっさてんで やすみましょう",k:"あの 喫茶店で 休みましょう",ko:"저 찻집에서 쉽시다"},{t:"build",s:"えきの まえで あいましょうか",k:"駅の 前で 会いましょうか",ko:"역 앞에서 만날까요?"}]}];var J4=[{id:"G25",title:"동사 て형",sub:"~하고 / ~해서",explain:['て형은 동사를 이어 주는 모양이에요. "~하고, ~해서"라는 뜻이에요.',"1그룹은 끝소리로 정해요: う·つ·る → って, む·ぶ·ぬ → んで, く → いて, ぐ → いで, す → して. 예: かう → かって. いく만 いって(예외)!","2그룹은 る를 빼고 て (たべる → たべて), 3그룹은 する → して, くる → きて예요."],ex:[{s:"あさ おきて かおを あらいます",k:"朝 起きて 顔を 洗います",ko:"아침에 일어나서 얼굴을 씻습니다"},{s:"ともだちに あって えいがを みました",k:"友達に 会って 映画を 見ました",ko:"친구를 만나서 영화를 봤습니다"},{s:"デパートへ いって シャツを かいました",k:"デパートへ 行って シャツを 買いました",ko:"백화점에 가서 셔츠를 샀습니다"},{s:"ともだちが うちに きて いっしょに あそびました",k:"友達が 家に 来て 一緒に 遊びました",ko:"친구가 집에 와서 같이 놀았습니다"}],q:[{t:"pick",s:"みずを {のんで} ねます",k:"水を {飲んで} 寝ます",o:["のみて","のって"],ko:"물을 마시고 잡니다"},{t:"pick",s:"てがみを {かいて} だします",k:"手紙を {書いて} 出します",o:["かって","かきて"],ko:"편지를 써서 부칩니다"},{t:"pick",s:"えきまで {いそいで} いきました",k:"駅まで {急いで} 行きました",o:["いそいて","いそって"],ko:"역까지 서둘러 갔습니다"},{t:"pick",s:"ともだちと {はなして} かえります",k:"友達と {話して} 帰ります",o:["はなって","はないて"],ko:"친구와 이야기하고 돌아갑니다"},{t:"pick",s:"がっこうへ {いって} べんきょうします",k:"学校へ {行って} 勉強します",o:["いいて","いきて"],ko:"학교에 가서 공부합니다"},{t:"pick",s:"うちへ {かえって} やすみます",k:"家へ {帰って} 休みます",o:["かえて","かえりて"],ko:"집에 돌아가서 쉽니다"},{t:"build",s:"ごはんを たべて はを みがきます",k:"ご飯を 食べて 歯を 磨きます",ko:"밥을 먹고 이를 닦습니다"},{t:"build",s:"しゅくだいを して ねます",k:"宿題を して 寝ます",ko:"숙제를 하고 잡니다"}]},{id:"G26",title:"～て ください",sub:"~해 주세요",explain:['동사 て형 + ください는 "~해 주세요"예요. 부탁할 때 써요.',"まつ → まって ください (기다려 주세요), みる → みて ください (봐 주세요)","앞에 すみません을 붙이면 더 부드러워요."],ex:[{s:"ちょっと まって ください",k:"ちょっと 待って ください",ko:"잠깐 기다려 주세요"},{s:"ここに なまえを かいて ください",k:"ここに 名前を 書いて ください",ko:"여기에 이름을 써 주세요"},{s:"もう いちど いって ください",k:"もう 一度 言って ください",ko:"한 번 더 말해 주세요"},{s:"くつを ぬいで ください",k:"靴を 脱いで ください",ko:"신발을 벗어 주세요"}],q:[{t:"pick",s:"まどを {あけて} ください",k:"窓を {開けて} ください",o:["あけって","あけりて"],ko:"창문을 열어 주세요"},{t:"pick",s:"この ほんを {よんで} ください",k:"この 本を {読んで} ください",o:["よみて","よって"],ko:"이 책을 읽어 주세요"},{t:"pick",s:"しおを {とって} ください",k:"塩を {取って} ください",o:["とりて","とんで"],ko:"소금 좀 집어 주세요"},{t:"pick",s:"しずかに {して} ください",k:"静かに {して} ください",o:["しって","すて"],ko:"조용히 해 주세요"},{t:"pick",s:"あした また {きて} ください",k:"明日 また {来て} ください",o:["くて","こて"],ko:"내일 또 와 주세요"},{t:"pick",s:"ゆっくり {はなして} ください",k:"ゆっくり {話して} ください",o:["はなって","はないて"],ko:"천천히 말해 주세요"},{t:"build",s:"この かんじを おしえて ください",k:"この 漢字を 教えて ください",ko:"이 한자를 가르쳐 주세요"},{t:"build",s:"しゃしんを みせて ください",k:"写真を 見せて ください",ko:"사진을 보여 주세요"}]},{id:"G27",title:"～て います",sub:"~하고 있다",explain:['동사 て형 + います는 "지금 ~하고 있어요"예요. (いま たべて います)',"계속되는 상태도 나타내요: すんで います (살고 있어요), しって います (알고 있어요)"],ex:[{s:"いま あめが ふって います",k:"今 雨が 降って います",ko:"지금 비가 내리고 있습니다"},{s:"おとうとは へやで ねて います",k:"弟は 部屋で 寝て います",ko:"남동생은 방에서 자고 있습니다"},{s:"あには ぎんこうで はたらいて います",k:"兄は 銀行で 働いて います",ko:"형은 은행에서 일하고 있습니다"},{s:"わたしは ソウルに すんで います",k:"私は ソウルに 住んで います",ko:"저는 서울에 살고 있습니다"}],q:[{t:"pick",s:"いま ごはんを {たべて} います",k:"今 ご飯を {食べて} います",o:["たべって","たべんで"],ko:"지금 밥을 먹고 있습니다"},{t:"pick",s:"いもうとは うたを {うたって} います",k:"妹は 歌を {歌って} います",o:["うたいて","うたんで"],ko:"여동생은 노래를 부르고 있습니다"},{t:"pick",s:"こどもたちが こうえんで {あそんで} います",k:"子供たちが 公園で {遊んで} います",o:["あそびて","あそって"],ko:"아이들이 공원에서 놀고 있습니다"},{t:"pick",s:"バスを {まって} います",k:"バスを {待って} います",o:["まちて","まんで"],ko:"버스를 기다리고 있습니다"},{t:"pick",s:"ともだちと でんわで {はなして} います",k:"友達と 電話で {話して} います",o:["はなって","はないて"],ko:"친구와 전화로 이야기하고 있습니다"},{t:"pick",s:"たなかさんを {しって} いますか",k:"田中さんを {知って} いますか",o:["しりて","しんで"],ko:"다나카 씨를 알고 있습니까?"},{t:"build",s:"あには とうきょうに すんで います",k:"兄は 東京に 住んで います",ko:"형은 도쿄에 살고 있습니다"},{t:"build",s:"おとうとは テレビを みて います",k:"弟は テレビを 見て います",ko:"남동생은 텔레비전을 보고 있습니다"}]},{id:"G28",title:"～ても いいです / ～ては いけません",sub:"~해도 된다 / ~하면 안 된다",explain:['て형 + も いいです는 "~해도 돼요"(허락)예요. 물어볼 때는 ～ても いいですか.','て형 + は いけません은 "~하면 안 돼요"(금지)예요.',"のむ → のんでも いいです / のんでは いけません"],ex:[{s:"ここで しゃしんを とっても いいですか",k:"ここで 写真を 撮っても いいですか",ko:"여기서 사진을 찍어도 됩니까?"},{s:"はい すわっても いいです",k:"はい 座っても いいです",ko:"네, 앉아도 됩니다"},{s:"ここで たばこを すっては いけません",k:"ここで たばこを 吸っては いけません",ko:"여기서 담배를 피우면 안 됩니다"},{s:"としょかんで たべては いけません",k:"図書館で 食べては いけません",ko:"도서관에서 먹으면 안 됩니다"}],q:[{t:"pick",s:"まどを {あけても} いいですか",k:"窓を {開けても} いいですか",o:["あけっても","あけては"],ko:"창문을 열어도 됩니까?"},{t:"pick",s:"この ペンを {つかっても} いいですか",k:"この ペンを {使っても} いいですか",o:["つかいても","つかんでも"],ko:"이 펜을 써도 됩니까?"},{t:"pick",s:"もう うちに {かえっても} いいです",k:"もう 家に {帰っても} いいです",o:["かえても","かえりても"],ko:"이제 집에 돌아가도 됩니다"},{t:"pick",s:"ここで {およいでは} いけません",k:"ここで {泳いでは} いけません",o:["およいては","およぎては"],ko:"여기서 수영하면 안 됩니다"},{t:"pick",s:"きょうしつで {はしっては} いけません",k:"教室で {走っては} いけません",o:["はしては","はしりては"],ko:"교실에서 뛰면 안 됩니다"},{t:"pick",s:"へやで ゲームを {しても} いいですか",k:"部屋で ゲームを {しても} いいですか",o:["しっても","すても"],ko:"방에서 게임을 해도 됩니까?"},{t:"build",s:"トイレに いっても いいですか",k:"トイレに 行っても いいですか",ko:"화장실에 가도 됩니까?"},{t:"build",s:"この みずを のんでは いけません",k:"この 水を 飲んでは いけません",ko:"이 물을 마시면 안 됩니다"}]},{id:"G29",title:"동사 ない형",sub:"~하지 않다",explain:['ない형은 "~하지 않다"는 모양이에요. 뒤에 です를 붙이면 ～ません과 비슷해요. (たべないです = たべません)',"1그룹은 끝소리를 あ단으로 바꾸고 ない: かく → かかない (う는 わ로: かう → かわない). 2그룹은 る를 빼고 ない: たべる → たべない.","3그룹은 する → しない, くる → こない. ある는 그냥 ない예요(예외)!"],ex:[{s:"わたしは おさけを のまないです",k:"私は お酒を 飲まないです",ko:"저는 술을 마시지 않습니다"},{s:"あには あさごはんを たべないです",k:"兄は 朝ご飯を 食べないです",ko:"형은 아침밥을 먹지 않습니다"},{s:"おとうとは べんきょうを しないです",k:"弟は 勉強を しないです",ko:"남동생은 공부를 하지 않습니다"},{s:"この へやには テレビが ないです",k:"この 部屋には テレビが ないです",ko:"이 방에는 텔레비전이 없습니다"}],q:[{t:"pick",s:"わたしは にくを {たべないです}",k:"私は 肉を {食べないです}",o:["たべらないです","たべるないです"],ko:"저는 고기를 먹지 않습니다"},{t:"pick",s:"あさは コーヒーを {のまないです}",k:"朝は コーヒーを {飲まないです}",o:["のみないです","のむないです"],ko:"아침에는 커피를 마시지 않습니다"},{t:"pick",s:"あの みせでは なにも {かわないです}",k:"あの 店では 何も {買わないです}",o:["かあないです","かいないです"],ko:"저 가게에서는 아무것도 사지 않습니다"},{t:"pick",s:"にちようびは しごとを {しないです}",k:"日曜日は 仕事を {しないです}",o:["すないです","さないです"],ko:"일요일에는 일을 하지 않습니다"},{t:"pick",s:"たなかさんは きょう {こないです}",k:"田中さんは 今日 {来ないです}",o:["きないです","くらないです"],ko:"다나카 씨는 오늘 오지 않습니다"},{t:"pick",s:"きょうは しゅくだいが {ないです}",k:"今日は 宿題が {ないです}",o:["あらないです","ありないです"],ko:"오늘은 숙제가 없습니다"},{t:"build",s:"いもうとは やさいを たべないです",k:"妹は 野菜を 食べないです",ko:"여동생은 채소를 먹지 않습니다"},{t:"build",s:"きょうは がっこうへ いかないです",k:"今日は 学校へ 行かないです",ko:"오늘은 학교에 가지 않습니다"}]},{id:"G30",title:"～ないで ください",sub:"~하지 마세요",explain:['ない형 + で ください는 "~하지 마세요"예요.',"たべる → たべない → たべないで ください (먹지 마세요)","부드럽게 말리거나 부탁할 때 써요."],ex:[{s:"ここで しゃしんを とらないで ください",k:"ここで 写真を 撮らないで ください",ko:"여기서 사진을 찍지 마세요"},{s:"わすれないで ください",k:"忘れないで ください",ko:"잊지 마세요"},{s:"へやで たばこを すわないで ください",k:"部屋で たばこを 吸わないで ください",ko:"방에서 담배를 피우지 마세요"},{s:"まだ かえらないで ください",k:"まだ 帰らないで ください",ko:"아직 돌아가지 마세요"}],q:[{t:"pick",s:"ここに {はいらないで} ください",k:"ここに {入らないで} ください",o:["はいないで","はいりないで"],ko:"여기에 들어가지 마세요"},{t:"pick",s:"この みずを {のまないで} ください",k:"この 水を {飲まないで} ください",o:["のみないで","のむないで"],ko:"이 물을 마시지 마세요"},{t:"pick",s:"じしょを {みないで} ください",k:"辞書を {見ないで} ください",o:["みらないで","みあないで"],ko:"사전을 보지 마세요"},{t:"pick",s:"ろうかを {はしらないで} ください",k:"廊下を {走らないで} ください",o:["はしないで","はしりないで"],ko:"복도에서 뛰지 마세요"},{t:"pick",s:"にちようびは {こないで} ください",k:"日曜日は {来ないで} ください",o:["きないで","くらないで"],ko:"일요일에는 오지 마세요"},{t:"pick",s:"きょうしつで ゲームを {しないで} ください",k:"教室で ゲームを {しないで} ください",o:["すないで","さないで"],ko:"교실에서 게임을 하지 마세요"},{t:"build",s:"としょかんで はなさないで ください",k:"図書館で 話さないで ください",ko:"도서관에서 이야기하지 마세요"},{t:"build",s:"まどを あけないで ください",k:"窓を 開けないで ください",ko:"창문을 열지 마세요"}]},{id:"G31",title:"사전형·た형 (보통체)",sub:"친구에게 말할 때",explain:["친구·가족에게는 ます 대신 보통체로 말해요. 사전형: 1그룹 いきます → いく, 2그룹 たべます → たべる, 3그룹 します → する, きます → くる",'た형은 "~했어"(과거)예요. て형의 て를 た로, で를 だ로 바꾸면 돼요: 1그룹 のんで → のんだ, 2그룹 たべて → たべた, 3그룹 して → した, きて → きた'],ex:[{s:"あした がっこうに いく",k:"明日 学校に 行く",ko:"내일 학교에 가"},{s:"きのう えいがを みた",k:"昨日 映画を 見た",ko:"어제 영화를 봤어"},{s:"まいにち コーヒーを のむ",k:"毎日 コーヒーを 飲む",ko:"매일 커피를 마셔"},{s:"もう ばんごはんを たべた",k:"もう 晩ご飯を 食べた",ko:"벌써 저녁밥을 먹었어"}],q:[{t:"pick",s:"きのう ともだちと {あそんだ}",k:"昨日 友達と {遊んだ}",o:["あそびた","あそった"],ko:"어제 친구랑 놀았어"},{t:"pick",s:"あさ パンを {たべた}",k:"朝 パンを {食べた}",o:["たべった","たべだ"],ko:"아침에 빵을 먹었어"},{t:"pick",s:"きのう てがみを {かいた}",k:"昨日 手紙を {書いた}",o:["かった","かきた"],ko:"어제 편지를 썼어"},{t:"pick",s:"せんしゅう きょうとへ {いった}",k:"先週 京都へ {行った}",o:["いいた","いきた"],ko:"지난주에 교토에 갔어"},{t:"pick",s:"ともだちが うちに {きた}",k:"友達が 家に {来た}",o:["くた","こた"],ko:"친구가 집에 왔어"},{t:"pick",s:"まいにち にほんごを {べんきょうする}",k:"毎日 日本語を {勉強する}",o:["べんきょうす","べんきょうしる"],ko:"매일 일본어를 공부해"},{t:"build",s:"ともだちの うちに いった",k:"友達の 家に 行った",ko:"친구 집에 갔어"},{t:"build",s:"あたらしい くつを かった",k:"新しい 靴を 買った",ko:"새 신발을 샀어"}]},{id:"G32",title:"～から (이유)",sub:"~니까, ~때문에",explain:['문장 + から는 "~니까, ~때문에"예요. 이유를 먼저 말하고 から를 붙여요.',"さむいですから まどを しめます (추우니까 창문을 닫아요)","な형용사·명사는 です를 꼭 넣어요: ひまですから (O), ひまから (X)"],ex:[{s:"あめですから タクシーで かえります",k:"雨ですから タクシーで 帰ります",ko:"비가 오니까 택시로 돌아갑니다"},{s:"じかんが ありませんから いそいで ください",k:"時間が ありませんから 急いで ください",ko:"시간이 없으니까 서둘러 주세요"},{s:"おなかが いっぱいですから たべません",k:"お腹が いっぱいですから 食べません",ko:"배가 부르니까 먹지 않겠습니다"},{s:"きょうは さむいですから コートを きます",k:"今日は 寒いですから コートを 着ます",ko:"오늘은 추우니까 코트를 입습니다"}],q:[{t:"pick",s:"{あついですから} まどを あけます",k:"{暑いですから} 窓を 開けます",o:["あついだから","あついなから"],ko:"더우니까 창문을 엽니다"},{t:"pick",s:"あたまが {いたいですから} かえります",k:"頭が {痛いですから} 帰ります",o:["いたいだから","いたくですから"],ko:"머리가 아프니까 돌아가겠습니다"},{t:"pick",s:"あしたは {テストですから} べんきょうします",k:"明日は {テストですから} 勉強します",o:["テストなから","テストから"],ko:"내일은 시험이니까 공부합니다"},{t:"pick",s:"この へやは {し
